{% extends "base.html" %}

{% block title %}Form Submitted{% endblock %}

{% block content %}
<div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-16 px-4 text-center rounded-lg mb-8">
    <h1 class="text-5xl font-bold mb-4">✓ Success!</h1>
    <p class="text-xl">Your form has been submitted</p>
</div>

<div class="max-w-3xl mx-auto px-4">
    <div class="bg-white rounded-lg shadow-md p-8 border border-gray-200 mb-8">
        <h2 class="text-2xl font-bold text-gray-900 mb-6">Submitted Data:</h2>
        <div class="overflow-x-auto">
            <table class="w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Field</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Value</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    <tr>
                        <td class="px-6 py-4 text-sm font-semibold text-gray-700">Name:</td>
                        <td class="px-6 py-4 text-sm text-gray-900">{{ name }}</td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 text-sm font-semibold text-gray-700">Email:</td>
                        <td class="px-6 py-4 text-sm text-gray-900">{{ email }}</td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 text-sm font-semibold text-gray-700">Message:</td>
                        <td class="px-6 py-4 text-sm text-gray-900">{{ message }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div>
        <a href="{{ url_for('forms.basic_form') }}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3 rounded-lg transition">← Back to Form</a>
    </div>
</div>
{% endblock %}
